name: Release

# Publishes to Maven Central when a version tag (for example v0.1.0) is pushed.
# The upload waits for manual review on central.sonatype.com; see RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build with the minimum supported JDK so the published bytecode is guaranteed to run on Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Check that the tag matches the project version
        run: |
          version="$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version. Set the version to $tag before tagging."
            exit 1
          fi

      - name: Build, test, sign and upload
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
